{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:480px;">

    <div class="card shadow-lg border-0" style="border-radius:var(--radius-lg);">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div style="font-size:2.2rem;">🔒</div>
                <h3 class="mt-2 mb-0">Choose a new password</h3>
            </div>

            <form method="POST" action="{{ url_for('reset_password', token=token) }}">

                <label class="form-label">New Password</label>
                <input class="form-control" type="password" name="password" minlength="6" required autofocus>
                <small class="text-muted">At least 6 characters.</small>

                <label class="form-label mt-3">Confirm New Password</label>
                <input class="form-control" type="password" name="confirm_password" minlength="6" required>

                <button type="submit" class="btn btn-primary w-100 mt-4">
                    Reset Password
                </button>

            </form>

        </div>
    </div>

</div>
{% endblock %}
