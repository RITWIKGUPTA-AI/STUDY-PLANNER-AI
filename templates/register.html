{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Create Account</h2>

    <form method="POST">

        <label>Name</label>
        <input class="form-control" 
               type="text" 
               name="name"
               required>


        <label class="mt-3">Username</label>
        <input class="form-control" 
               type="text" 
               name="username"
               required>


        <label class="mt-3">Email</label>
        <input class="form-control" 
               type="email" 
               name="email"
               required>
        <small class="text-muted">Used only for password recovery.</small>


        <label class="mt-3">Password</label>
        <input class="form-control" 
               type="password" 
               name="password"
               minlength="6"
               required>
        <small class="text-muted">At least 6 characters.</small>


        <label class="mt-3">Confirm Password</label>
        <input class="form-control" 
               type="password" 
               name="confirm_password"
               minlength="6"
               required>


        <button class="btn btn-primary mt-4">
            Create Account
        </button>

    </form>

</div>

{% endblock %}
