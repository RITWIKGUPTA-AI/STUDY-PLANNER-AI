{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:480px;">

    <div class="card shadow-lg border-0" style="border-radius:var(--radius-lg);">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div style="font-size:2.2rem;">🔑</div>
                <h3 class="mt-2 mb-0">Forgot your password?</h3>
                <p class="text-muted small">Enter your username or email and we'll send you a reset link.</p>
            </div>

            <form method="POST">

                <label class="form-label">Username or Email</label>
                <input class="form-control" type="text" name="identifier" required autofocus>

                <button type="submit" class="btn btn-primary w-100 mt-4">
                    Send Reset Link
                </button>

            </form>

            <p class="text-center small text-muted mt-3 mb-0">
                <a href="{{ url_for('login') }}">← Back to Login</a>
            </p>

        </div>
    </div>

</div>
{% endblock %}
