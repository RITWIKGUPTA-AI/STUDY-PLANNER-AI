<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — Student Study Planner</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,sans-serif;background:#F5F7FA;color:#1E2530;text-align:center;padding:24px;}
  .box{max-width:360px;}
  .icon{font-size:56px;margin-bottom:12px;}
  h1{font-size:1.3rem;margin:0 0 8px;}
  p{color:#64748B;font-size:.95rem;line-height:1.5;}
  button{margin-top:18px;padding:10px 22px;border:none;border-radius:10px;
         background:#2F4B7C;color:#fff;font-size:.95rem;cursor:pointer;}
  button:active{background:#20365C;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Your saved tasks and notes will sync
       again as soon as you're back online.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
